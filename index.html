
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIPPS MAN Suta</title>

  <link rel="icon"
    href="https://cbtonline.biz.id/image/MAN1TD_logo.png">

  <meta name="theme-color" content="#eee">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #eee;
    }

    .loading {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 15px;
      color: #444;
    }

    .loading img {
      width: 75px;
      height: 75px;
      object-fit: contain;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 4px solid #ddd;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div class="loading">
    <img
      src="https://cbtonline.biz.id/image/MAN1TD_logo.png"
      alt="Logo MAN"
    >

    <strong>SIPPS MAN Suta</strong>

    <div class="spinner"></div>

    <span>Menghubungkan ke aplikasi...</span>
  </div>

  <script>
    const appURL =
      "https://script.google.com/macros/s/AKfycbyjHCBc0Ew6IjKjvxkqupNlAwSjpLMyJBLblFO8yV6VkMkO9PpXdPGO5dGhSxnFYaVa/exec";

    window.location.replace(appURL);
  </script>

</body>
</html>
